publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.1.2
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  flutter_map: ^8.3.2
